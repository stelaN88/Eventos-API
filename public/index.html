<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda de Eventos</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --primary: #258ac0;
      --accent: #216ec6;
      --danger: #c1121f;
      --text: #1b1b1b;
      --muted: #6c757d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
    }

    .form {
      background: var(--card);
      padding: 15px;
      border-radius: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    .form input {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
    }

    .form button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    .form button:hover {
      opacity: 0.9;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      background: var(--card);
      padding: 15px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item h3 {
      margin-bottom: 5px;
    }

    .item small {
      color: var(--muted);
    }

    .actions button {
      margin-left: 5px;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .edit {
      background: #f4a261;
      color: white;
    }

    .delete {
      background: var(--danger);
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agenda de Eventos</h1>

    <div class="form">
      <input type="text" id="title" placeholder="Título do evento" />
      <input type="date" id="date" />
      <button onclick="addEvent()">Agendar</button>
    </div>

    <div class="list" id="list"></div>
  </div>

  <script>
    let events = [];
    let editIndex = null;

    function render() {
      const list = document.getElementById('list');
      list.innerHTML = '';

      events.forEach((event, index) => {
        list.innerHTML += `
          <div class="item">
            <div>
              <h3>${event.title}</h3>
              <small>${event.date}</small>
            </div>
            <div class="actions">
              <button class="edit" onclick="editEvent(${index})">Editar</button>
              <button class="delete" onclick="deleteEvent(${index})">Excluir</button>
            </div>
          </div>
        `;
      });
    }

    function addEvent() {
      const title = document.getElementById('title').value;
      const date = document.getElementById('date').value;

      if (!title || !date) return;

      if (editIndex !== null) {
        events[editIndex] = { title, date };
        editIndex = null;
      } else {
        events.push({ title, date });
      }

      document.getElementById('title').value = '';
      document.getElementById('date').value = '';

      render();
    }

    function deleteEvent(index) {
      events.splice(index, 1);
      render();
    }

    function editEvent(index) {
      document.getElementById('title').value = events[index].title;
      document.getElementById('date').value = events[index].date;
      editIndex = index;
    }

    render();
  </script>
</body>
</html>
